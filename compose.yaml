# Starting point for an application under /home/ichabod/apps/pocket-locks/.
# Copy it, then replace every pocket-locks and the port. The resource limits are not
# suggestions: they are the only ceiling on this box that Docker enforces
# rather than Ichabod remembering.

name: pocket-locks

services:
  web:
    build: .
    restart: unless-stopped
    # No published host port. Traefik reaches the container over the proxy
    # network, so exposing one would only open a second, unrouted door.
    expose:
      - "3000"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.pocket-locks.rule=Host(`pocket-locks.ichabod-crane.net`)"
      # Cloudflare serves HTTPS and the tunnel hands Traefik plain HTTP, so there is no certificate here.
      - traefik.http.routers.pocket-locks.entrypoints=web
      - traefik.http.services.pocket-locks.loadbalancer.server.port=3000
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options:
        max-size: 10m
        max-file: "3"

networks:
  proxy:
    external: true
    name: ichabod-proxy
